<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8e5df" />
<title>BIS Licence</title>
<style>
  /* Shiv Panel's palette (src/index.css), light and dark. */
  :root {
    --bg: #e8e5df; --card: #f3f0ea; --card2: #ede9e1; --fg: #1c1917; --muted: #6b625b;
    --line: rgba(28, 25, 23, 0.12); --brass: #b9924b; --brass-ink: #201804; --brass-text: #7d5f22;
    --red: #9f1d20; --red-tint: rgba(159, 29, 32, 0.09);
    --green: #1a7a4a; --green-text: #146239; --green-ink: #ffffff; --green-tint: rgba(26, 122, 74, 0.09);
    --amber-text: #8a5410; --amber-tint: rgba(180, 112, 22, 0.12);
    --lift: 0 10px 30px rgba(28, 25, 23, 0.14); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12110f; --card: #1a1815; --card2: #211e1a; --fg: #eae7e1; --muted: #a8a29e;
      --line: rgba(255, 255, 255, 0.10); --brass: #c9a45c; --brass-ink: #1a1204; --brass-text: #c9a45c;
      --red: #d3595c; --red-tint: rgba(211, 89, 92, 0.12);
      --green: #4cb782; --green-text: #4cb782; --green-ink: #06210f; --green-tint: rgba(76, 183, 130, 0.12);
      --amber-text: #d9a441; --amber-tint: rgba(217, 164, 65, 0.14);
      --lift: 0 10px 34px rgba(0, 0, 0, 0.44);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
  h1 span { color: var(--brass-text); }

  .cam {
    position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden;
    background: #000; border: 3px solid var(--line); transition: border-color 0.15s;
  }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .band {
    position: absolute; left: 7%; right: 7%; top: 39%; height: 22%;
    border: 2px solid rgba(255, 255, 255, 0.85); border-radius: 8px;
    box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.35); transition: border-color 0.15s, background 0.15s;
  }
  .cam.reading .band { border-color: var(--brass); }
  .cam.locked { border-color: var(--green); }
  .cam.locked .band { border-color: var(--green); border-width: 4px; background: rgba(26, 122, 74, 0.25); }
  .read {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.6); color: #fff; font: 600 15px ui-monospace, Menlo, monospace;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: none;
  }
  .cam.reading .read, .cam.locked .read { display: block; }
  .cam.locked .read { background: var(--green); color: var(--green-ink); display: flex; gap: 6px; align-items: center; }
  .cam.locked .read svg { width: 16px; height: 16px; }
  .start {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--card2); color: var(--brass-text); border: 0; width: 100%; cursor: pointer;
  }
  .start svg { width: 44px; height: 44px; stroke-width: 1.6; }
  .cam.on .start { display: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 6px; }
  input {
    width: 100%; height: 48px; padding: 0 12px; font-size: 20px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); outline: none;
  }
  input:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(185, 146, 75, 0.25); }
  #licence { font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; }
  #licence.got { border-color: var(--green); background: var(--green-tint); }
  .go {
    width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--brass); color: var(--brass-ink); font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .go:disabled { opacity: 0.6; }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 15px; font-weight: 600; display: none; }
  .msg.bad { display: block; background: var(--red-tint); color: var(--red); }
  .msg.warn { display: block; background: var(--amber-tint); color: var(--amber-text); }

  .result { margin-top: 12px; }
  .hit { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--green); border-radius: var(--radius); padding: 14px; box-shadow: var(--lift); margin-bottom: 10px; }
  .hit.off { border-left-color: var(--red); }
  .firm { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .addr { color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 12px; font-size: 15px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 600; white-space: pre-line; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .badge.ok { background: var(--green-tint); color: var(--green-text); }
  .badge.no { background: var(--red-tint); color: var(--red); }

  .recent { margin-top: 18px; }
  .recent button {
    width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-top: 1px solid var(--line);
    padding: 10px 2px; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; cursor: pointer;
  }
  .recent button span:last-child { color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>BIS <span>Licence</span></h1>
</header>

<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="band"></div>
  <div class="read" id="read"></div>
  <button class="start" id="start" aria-label="Scan">
    <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
  </button>
</div>

<form class="card" id="form" autocomplete="off">
  <label for="licence">CM/L</label>
  <input id="licence" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="0000000" enterkeyhint="search" />
  <button class="go" id="go" type="submit">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search
  </button>
  <div class="msg" id="msg"></div>
</form>

<div class="result" id="result"></div>
<div class="recent" id="recent"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const SEARCH = $("go").innerHTML;

// ── Search (the server reads the BIS captcha itself) ───────────────
function say(text, kind = "bad") { const m = $("msg"); m.textContent = text; m.className = text ? `msg ${kind}` : "msg"; }

async function search() {
  const licence = $("licence").value.replace(/\D/g, "");
  if (licence.length < 7) { say("CM/L needs 7–10 digits"); $("licence").focus(); return; }
  if ($("go").disabled) return;
  say(""); $("go").disabled = true; $("go").textContent = "Searching…";
  try {
    const res = await fetch("/api/lookup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ licence }) });
    const r = await res.json();
    if (r.error === "captcha") { say("BIS captcha misread twice, search again", "warn"); return; }
    if (r.error === "blocked") { say("BIS sent nothing back, try again in a while", "warn"); return; }
    if (r.error) { say("BIS not responding"); return; }
    if (!r.rows.length) { $("result").innerHTML = ""; say(`No licence ${licence}`, "warn"); return; }
    render(r.rows);
    remember(r.rows);
    $("licence").blur();
  } catch { say("BIS not responding"); }
  finally { $("go").disabled = false; $("go").innerHTML = SEARCH; }
}
$("form").onsubmit = (e) => { e.preventDefault(); search(); };

// ── Result + recent ────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (d) => { const m = String(d || "").match(/(\d{4})\/(\d{2})\/(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : d || ""; };
function render(rows) {
  $("result").innerHTML = rows.map((r) => {
    const ok = /operative/i.test(r.status);
    return `<div class="hit ${ok ? "" : "off"}">
      <div class="firm">${esc(r.firm)}</div>
      <div class="addr">${esc(r.address)}${r.pin ? ` – ${esc(r.pin)}` : ""}<br>${esc(r.district)}, ${esc(r.state)}</div>
      <dl class="kv">
        <dt>Status</dt><dd><span class="badge ${ok ? "ok" : "no"}">${esc(r.status)}</span></dd>
        <dt>Valid to</dt><dd>${esc(fmtDate(r.validity))}</dd>
        <dt>CM/L</dt><dd>${esc(String(r.licence).replace(/^0+/, ""))}</dd>
        <dt>Standard</dt><dd>${esc(r.standard)}</dd>
        <dt>Grade</dt><dd>${esc(r.grade)}</dd>
      </dl></div>`;
  }).join("");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}
function loadRecent() { try { return JSON.parse(localStorage.getItem("bis-recent") || "[]"); } catch { return []; } }
function remember(rows) {
  const key = String(rows[0].licence);
  const list = [{ key, rows }, ...loadRecent().filter((x) => x.key !== key)].slice(0, 20);
  try { localStorage.setItem("bis-recent", JSON.stringify(list)); } catch {}
  drawRecent();
}
function drawRecent() {
  const list = loadRecent();
  $("recent").innerHTML = list.length ? `<label>Recent</label>` + list.map((x, i) =>
    `<button data-i="${i}"><span>${esc(x.rows[0].firm)}</span><span>${esc(x.key.replace(/^0+/, ""))}</span></button>`).join("") : "";
  $("recent").querySelectorAll("button").forEach((b) => (b.onclick = () => render(list[+b.dataset.i].rows)));
}

// ── Camera + OCR ───────────────────────────────────────────────────
const video = $("video"), cam = $("cam");
let stream = null, worker = null, scanning = false, audio = null;
const crop = document.createElement("canvas");
const ctx = crop.getContext("2d", { willReadFrequently: true });

function beep() {
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = 1760;
    g.gain.setValueAtTime(0.18, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.16);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.17);
  } catch {}
  navigator.vibrate?.(90);
}

async function getWorker() {
  if (worker) return worker;
  worker = await Tesseract.createWorker("eng");
  await worker.setParameters({ tessedit_char_whitelist: "CML/:0123456789 ", tessedit_pageseg_mode: "7" });
  return worker;
}

// The band on screen, mapped onto the video frame (video is object-fit: cover).
function grabBand() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  const band = cam.querySelector(".band").getBoundingClientRect(), box = video.getBoundingClientRect();
  const scale = Math.max(box.width / vw, box.height / vh);
  const ox = (box.width - vw * scale) / 2, oy = (box.height - vh * scale) / 2;
  const sx = (band.left - box.left - ox) / scale, sy = (band.top - box.top - oy) / scale;
  const sw = band.width / scale, sh = band.height / scale;
  const w = Math.min(1400, Math.round(sw)), h = Math.round((sh * w) / sw);
  crop.width = w; crop.height = h;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  // Grey + Otsu threshold: dark stamp ink on light veneer becomes black on white.
  const img = ctx.getImageData(0, 0, w, h), d = img.data, hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) { const y = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0; d[i] = y; hist[y]++; }
  const total = w * h; let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue; const wF = total - wB; if (!wF) break;
    sB += t * hist[t]; const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > best) { best = v; thr = t; }
  }
  for (let i = 0; i < d.length; i += 4) { const v = d[i] > thr ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = v; }
  ctx.putImageData(img, 0, 0);
  return crop;
}

function pickNumber(text) {
  const t = text.replace(/\s+/g, " ");
  const tagged = t.match(/C\s?M\s?\/?\s?L\s?[:\/]?\s?(\d{7,10})(?!\d)/);
  if (tagged) return tagged[1];
  const runs = t.match(/\d{7,10}(?!\d)/g);
  return runs && runs.length === 1 ? runs[0] : null;
}

async function scanLoop() {
  const w = await getWorker();
  let last = null;
  while (scanning) {
    const frame = grabBand();
    if (frame) {
      const { data } = await w.recognize(frame);
      if (!scanning) break;
      const n = data.confidence > 40 ? pickNumber(data.text) : null;
      $("read").textContent = n || data.text.trim().slice(0, 24) || "…";
      if (n && n === last) return lock(n); // same number twice in a row
      last = n;
    }
    await new Promise((r) => setTimeout(r, 120));
  }
}

function lock(n) {
  scanning = false;
  cam.classList.remove("reading"); cam.classList.add("locked");
  $("read").innerHTML = `${CHECK}${n}`;
  beep();
  const f = $("licence"); f.value = n; f.classList.add("got");
  stopCamera(false);
  search(); // scanned number goes straight to BIS
}

function stopCamera(clearLock = true) {
  scanning = false;
  stream?.getTracks().forEach((t) => t.stop()); stream = null;
  cam.classList.remove("on", "reading");
  if (clearLock) cam.classList.remove("locked");
}

$("start").onclick = async () => {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume?.();
  cam.classList.remove("locked"); $("licence").classList.remove("got"); say("");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
  } catch { say("Camera blocked"); return; }
  video.srcObject = stream; await video.play();
  cam.classList.add("on", "reading"); $("read").textContent = "…";
  scanning = true;
  scanLoop().catch(() => { say("Reader failed to load"); stopCamera(); });
};
// Tap the live picture to stop.
video.onclick = () => { if (scanning) stopCamera(); };
$("licence").oninput = () => $("licence").classList.remove("got");

drawRecent();
</script>
</body>
</html>
