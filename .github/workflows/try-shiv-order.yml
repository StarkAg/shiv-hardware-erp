# Opens the Shiv Order app on an Android emulator and keeps screenshots and the
# crash log (Actions > Try Shiv Order > Run workflow; the files come back as the
# "shiv-order-try" artifact). It opens the PIN screen, then the order screen with
# a pretend login (no real sends: the token is not a real one).
name: Try Shiv Order
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiv-order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: shiv-order
          script: |
            mkdir -p ../try
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n in.shivhardware.order/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/1-pin.png && adb pull /sdcard/1-pin.png ../try/1-pin.png
            adb shell am force-stop in.shivhardware.order
            printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?>\n<map>\n<string name="token">not-a-real-token</string>\n</map>\n' > /tmp/shop.xml
            adb push /tmp/shop.xml /data/local/tmp/shop.xml
            adb shell run-as in.shivhardware.order mkdir -p shared_prefs
            adb shell run-as in.shivhardware.order cp /data/local/tmp/shop.xml shared_prefs/shop.xml
            adb shell am start -W -n in.shivhardware.order/.MainActivity
            sleep 12
            adb shell screencap -p /sdcard/2-order.png && adb pull /sdcard/2-order.png ../try/2-order.png
            adb shell input tap 300 1400
            sleep 3
            adb shell screencap -p /sdcard/3-after-tap.png && adb pull /sdcard/3-after-tap.png ../try/3-after-tap.png
            adb logcat -d > ../try/logcat.txt
            adb logcat -d -b crash > ../try/crash.txt || true
            cat ../try/crash.txt
            grep -A40 "FATAL EXCEPTION" ../try/logcat.txt || echo "NO CRASH IN LOGCAT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiv-order-try
          path: try/
