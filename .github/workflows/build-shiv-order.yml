# Builds the Shiv Order Android app (shiv-order/) on GitHub, so no shop computer
# needs the Android tools. Runs on every push that changes the app, or by hand
# (Actions > Build Shiv Order > Run workflow). The signed file comes back as an
# artifact:
#   gh run download <run-id> -n shiv-order -D shiv-order-ci
#
# It is signed with the shop's one Shiv Order key, so each build installs over
# the last. The key and its password are the SHIV_ORDER_KEYSTORE_B64 and
# SHIV_ORDER_KEYSTORE_PASSWORD secrets; a copy is kept on the shop PC in
# Documents\Shiv Order signing key. Nothing here can write anywhere.
name: Build Shiv Order
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shiv-order/**'
      - '.github/workflows/build-shiv-order.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiv-order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: The signing key
        env:
          KEY_B64: ${{ secrets.SHIV_ORDER_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SHIV_ORDER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::warning::No signing key secret: this build is signed with a throwaway key and will not install over the shop's app."; exit 0; fi
          printf '%s' "$KEY_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/shiv-order.jks"
          echo "SHIV_ORDER_KEYSTORE=$RUNNER_TEMP/shiv-order.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          echo "SHIV_ORDER_KEYSTORE_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Shiv_Order.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shiv-order
          path: shiv-order/Shiv_Order.apk
