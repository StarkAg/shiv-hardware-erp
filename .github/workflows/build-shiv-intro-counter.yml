# Builds the Shiv Intro Counter Android app (shiv-intro-counter/) for the staff's
# phones, on GitHub, so no shop computer needs the Android tools. Runs on every push
# that changes the app, or by hand. The signed file comes back as an artifact:
#   gh run download <run-id> -n shiv-intro-counter -D shiv-intro-counter-ci
#
# Signed with the shop's Shiv_Intro key (SHIV_INTRO_KEYSTORE_B64 and
# SHIV_INTRO_KEYSTORE_PASSWORD), the same as shiv-intro/. Nothing here can write anywhere.
name: Build Shiv Intro Counter
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shiv-intro-counter/**'
      - '.github/workflows/build-shiv-intro-counter.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiv-intro-counter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: The signing key
        env:
          KEY_B64: ${{ secrets.SHIV_INTRO_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SHIV_INTRO_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEY_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/shiv-intro.jks"
          echo "SHIV_INTRO_KEYSTORE=$RUNNER_TEMP/shiv-intro.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          echo "SHIV_INTRO_KEYSTORE_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Shiv_Intro_Counter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shiv-intro-counter
          path: shiv-intro-counter/Shiv_Intro_Counter.apk
