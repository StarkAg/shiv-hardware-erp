<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatsApp Hi sign</title>
<!-- The counter sign: scan, tap Send, and Tony's number sends the greeting and
     visiting card back (whatsapp-bills, the hi-reply). Print on A5. -->
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("./barlow-condensed-800.woff2") format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; src: url("./barlow-semi-condensed-600.woff2") format("woff2"); }
@page { size: A5; margin: 0; }
:root { color-scheme: light; --ink: #0e1318; --grey: #4c5660; --blue: #0054b4; }
html, body { margin: 0; background: #fff; color: var(--ink); }
.sheet { width: 148mm; height: 210mm; box-sizing: border-box; padding: 12mm 12mm 10mm; display: flex; flex-direction: column; align-items: center; text-align: center; border: 2.5mm solid var(--ink); }
h1 { font: 800 17mm/0.95 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0; letter-spacing: 0.3mm; }
.sub { font: 600 6.4mm/1.2 "Barlow Semi Condensed", sans-serif; margin: 2mm 0 5mm; color: var(--grey); }
.qr { width: 72mm; height: 72mm; padding: 4mm; border: 1.2mm solid var(--ink); }
.qr svg { width: 100%; height: 100%; display: block; }
.steps { list-style: none; margin: 6mm 0 0; padding: 0; width: 100%; font: 600 6.6mm/1.25 "Barlow Semi Condensed", sans-serif; text-align: left; }
.steps li { display: flex; align-items: center; gap: 4mm; margin-bottom: 2.5mm; }
.steps b { flex: none; width: 9mm; height: 9mm; background: var(--blue); color: #fff; display: grid; place-items: center; font: 800 6.4mm/1 "Barlow Condensed", sans-serif; }
.foot { margin-top: auto; font: 800 8.6mm/1 "Barlow Condensed", sans-serif; text-transform: uppercase; display: flex; align-items: center; gap: 3mm; }
.foot svg { width: 8mm; height: 8mm; }
</style>
</head>
<body>
<div class="sheet">
  <h1>Our card on<br>WhatsApp</h1>
  <p class="sub">Scan with your phone camera</p>
  <div class="qr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h29v29H0z"/><path stroke="#0e1318" d="M0 0.5h7m2 0h2m3 0h1m2 0h2m1 0h1m1 0h7M0 1.5h1m5 0h1m1 0h3m2 0h1m4 0h2m2 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m3 0h2m3 0h1m1 0h1m1 0h2m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h1m2 0h4m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m2 0h2m2 0h1m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m2 0h1m2 0h1m1 0h7m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 7.5h3m3 0h1m1 0h3M0 8.5h1m1 0h1m1 0h1m1 0h1m3 0h1m5 0h1m1 0h3m3 0h1m2 0h1M1 9.5h4m3 0h2m3 0h1m1 0h2m1 0h1m1 0h3m2 0h1m2 0h1M1 10.5h7m1 0h3m2 0h3m1 0h7m1 0h3M4 11.5h1m2 0h1m1 0h2m2 0h2m1 0h3m1 0h1m3 0h1m2 0h1M1 12.5h2m2 0h4m1 0h3m1 0h2m3 0h2m1 0h1m2 0h1m1 0h2M0 13.5h2m2 0h1m5 0h1m1 0h1m1 0h2m2 0h1m2 0h2m2 0h1m2 0h1M0 14.5h4m2 0h1m1 0h1m3 0h2m3 0h1m3 0h1m3 0h1m1 0h2M2 15.5h1m1 0h1m2 0h5m3 0h1m1 0h1m1 0h2m1 0h1m1 0h2m1 0h1M0 16.5h2m4 0h1m1 0h1m1 0h1m1 0h1m3 0h1m1 0h1m3 0h1m2 0h1m1 0h2M1 17.5h1m1 0h1m5 0h2m1 0h2m1 0h2m1 0h1m4 0h1m1 0h2m1 0h1M0 18.5h1m2 0h1m2 0h2m1 0h1m2 0h1m1 0h3m5 0h3m2 0h2M1 19.5h1m3 0h1m2 0h2m2 0h3m1 0h3m1 0h2m1 0h1m1 0h1m1 0h1M0 20.5h1m1 0h6m6 0h3m1 0h1m1 0h5M8 21.5h1m1 0h3m1 0h2m4 0h1m3 0h1m1 0h3M0 22.5h7m2 0h2m1 0h2m2 0h2m2 0h1m1 0h1m1 0h2m1 0h2M0 23.5h1m5 0h1m8 0h1m1 0h4m3 0h2m1 0h2M0 24.5h1m1 0h3m1 0h1m1 0h2m2 0h1m3 0h1m3 0h5m2 0h1M0 25.5h1m1 0h3m1 0h1m3 0h3m2 0h7m1 0h2m1 0h2M0 26.5h1m1 0h3m1 0h1m1 0h1m1 0h5m1 0h6m1 0h3m2 0h1M0 27.5h1m5 0h1m2 0h1m2 0h1m4 0h1m3 0h1m2 0h1m2 0h1M0 28.5h7m1 0h1m2 0h1m3 0h1m2 0h1m2 0h1m1 0h3m1 0h2"/></svg>
</div>
  <ol class="steps">
    <li><b>1</b>Scan the code</li>
    <li><b>2</b>Tap Send on the "Hi"</li>
    <li><b>3</b>Our visiting card comes back in seconds</li>
  </ol>
  <div class="foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
    80928 50954
  </div>
</div>
</body>
</html>
