<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Guarantee card</title>
<style>
  :root { color-scheme: light dark; --bg: #e8e5df; --fg: #1c1917; --muted: #78716c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12110f; --fg: #eae7e1; --muted: #a8a29e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Guarantee card</h1>
    <p>Scan the QR code on your guarantee card to open it.</p>
  </main>
</body>
</html>
