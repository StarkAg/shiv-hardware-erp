<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./counter/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./counter/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./counter/apple-touch-icon.png" />
    <meta name="theme-color" content="#b98f4b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shiv Counter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Pinch zoom stays on: small ledger tables have to be readable to everyone.
         On an iPhone maximum-scale only stops the jump into a small text box when
         it is tapped; Safari still lets the user pinch. Elsewhere it would block
         pinching, so it is set for iOS alone. -->
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1.0'
      }
    </script>
    <title>Shiv Hardware Counter</title>
    <!-- Apply theme BEFORE CSS loads so there is never a flash or override fight. -->
    <script>
      try {
        if (localStorage.getItem('shiv-panel:theme') === 'dark') {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/counter.tsx"></script>
  </body>
</html>
