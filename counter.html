<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./counter/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./counter/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./counter/apple-touch-icon.png" />
    <meta name="theme-color" content="#b98f4b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shiv Quotation" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Shiv Hardware Counter</title>
    <!-- Apply theme BEFORE CSS loads so there is never a flash or override fight. -->
    <script>
      try {
        if (localStorage.getItem('shiv-panel:theme') === 'dark') {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/counter.tsx"></script>
  </body>
</html>
